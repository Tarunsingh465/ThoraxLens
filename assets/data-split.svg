<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">ThoraxLens dataset split</title><desc id="desc">112120 image files: 86524 in official train and validation list, internally split into 73023 train and 13501 validation, and 25596 official held-out test images.</desc>
