    <text x="114" y="156" text-anchor="middle" font-size="15">Filename validation</text>
    <text x="114" y="179" text-anchor="middle" font-size="15">Patient split audit</text>
  </g>
  <g transform="translate(324 112)">
    <rect width="228" height="220" rx="18" fill="url(#card)" stroke="#bbd4e5" stroke-width="2"/>
