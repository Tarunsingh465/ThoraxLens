<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">ThoraxLens workflow</title><desc id="desc">From image metadata and audited patient splits through DenseNet-121 to per-finding scores, validation thresholds and exploratory saliency maps.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e9f3fb"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b9a9a"/><stop offset="1" stop-color="#537de4"/></linearGradient></defs>
<rect x="1" y="1" width="1398" height="428" rx="24" fill="#f8fbff" stroke="#d3e3ef" stroke-width="2"/>
<text x="48" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#12304a">ThoraxLens inference and evaluation workflow</text>
<g font-family="Segoe UI,Arial,sans-serif" fill="#12304a">
