    <path d="M94 49H134M114 29V69M99 35L129 65M129 35L99 65" stroke="#148f89" stroke-width="3" stroke-linecap="round"/>
    <text x="114" y="103" text-anchor="middle" font-size="20" font-weight="700">Preprocessing</text>
    <text x="114" y="133" text-anchor="middle" font-size="15">224 × 224 input</text>
    <text x="114" y="156" text-anchor="middle" font-size="15">Label normalization</text>
    <text x="114" y="179" text-anchor="middle" font-size="15">Train / validation / test</text>
  </g>
  <g transform="translate(608 112)">
    <rect width="228" height="220" rx="18" fill="#e8edff" stroke="#aebefa" stroke-width="2"/>
    <circle cx="114" cy="50" r="27" fill="#d4dcff"/>
    <g stroke="#596fd7" stroke-width="3" stroke-linecap="round"><path d="M93 37L114 50L135 34M93 37L95 61L114 50L133 63L135 34M95 61L112 72L133 63"/></g>
    <g fill="#596fd7"><circle cx="93" cy="37" r="4"/><circle cx="114" cy="50" r="4"/><circle cx="135" cy="34" r="4"/><circle cx="95" cy="61" r="4"/><circle cx="133" cy="63" r="4"/><circle cx="112" cy="72" r="4"/></g>
    <text x="114" y="103" text-anchor="middle" font-size="20" font-weight="700">DenseNet-121</text>
    <text x="114" y="133" text-anchor="middle" font-size="15">14-output classifier</text>
    <text x="114" y="156" text-anchor="middle" font-size="15">Fine-tuned checkpoint</text>
    <text x="114" y="179" text-anchor="middle" font-size="15">GPU / AMP training</text>
  </g>
  <g transform="translate(892 112)">
